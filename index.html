<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#e8f3f1;--ink:#14323a;--card:#2e86ab;--face:#fff7d6;--hit:#9be3b0;--ad:#d5e5e2;
        --pink:#e8508f;--gold:#f5b700}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif}
  .screen{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
  .hidden{display:none}
  h1{font-size:2rem;font-weight:800;margin:8px 0 4px}
  button{font-family:inherit}
  .btn{padding:12px 30px;border:0;border-radius:999px;background:var(--ink);color:#fff;
       font-size:1.05rem;font-weight:800;cursor:pointer;margin:8px 0}
  .btn.pink{background:var(--pink)}
  .btn.light{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  .btn.small{padding:6px 16px;font-size:.9rem;margin:0}
  .ad{width:100%;max-width:380px;min-height:70px;margin:10px 0;background:var(--ad);border-radius:10px;
      display:flex;align-items:center;justify-content:center;font-size:.8rem;opacity:.8}

  /* الصفحة الرئيسية */
  #home{justify-content:center;text-align:center}
  #home h1{font-size:2.6rem;color:var(--pink)}
  #home p{margin:0 0 18px;max-width:300px}

  /* الحية والدرج */
  #snakes{padding-bottom:130px}
  .topbar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  #status{font-weight:800;text-align:center;flex:1;padding:0 8px}
  .boardwrap{position:relative;width:min(96vw,560px);aspect-ratio:2/1;direction:ltr}
  .sboard{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,1fr);gap:2px}
  .cell{background:var(--pink);color:#fff;font-weight:800;font-size:clamp(.6rem,2.6vw,.95rem);
        display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 3px;border-radius:4px}
  #lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .token{position:absolute;width:4.6%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;
         transform:translate(-50%,-50%);transition:left .28s,top .28s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .token.me{background:#2e86ab}
  .token.cpu{background:#14323a}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:.9rem}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:5px;vertical-align:middle}

  /* النرد: أسفل وسط الشاشة */
  #dice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:84px;height:84px;border:0;
        border-radius:18px;background:linear-gradient(145deg,#ffd84d,var(--gold));
        box-shadow:0 5px 0 #b88600,0 8px 14px rgba(0,0,0,.3);padding:10px;cursor:pointer;
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:5}
  #dice:disabled{cursor:default;filter:saturate(.7)}
  #dice:focus-visible{outline:3px solid var(--ink)}
  #dice span{width:100%;height:100%;border-radius:50%;background:transparent;transform:scale(.8)}
  #dice span.on{background:var(--pink)}
  #dice.rolling{animation:shake .12s infinite}
  @keyframes shake{50%{transform:translateX(-50%) rotate(8deg)}}

  /* الوصف التحليلي أعلى الشاشة */
  .analysis{width:100%;max-width:560px;background:#fff;border:2px solid var(--ink);border-radius:14px;
            padding:8px 12px;margin-bottom:10px;font-size:.92rem;line-height:1.7}
  .analysis .arow{min-height:3.4em}
  .analysis .arow b{display:inline-block;min-width:4.4em}
  .analysis .arow.me b{color:#2e86ab}
  .analysis .arow.cpu b{color:#14323a}
  .analysis .apos{margin-top:4px;padding-top:5px;border-top:1px dashed #8fb0b0;font-size:.82rem;opacity:.9}
  #sound{padding:6px 12px;font-size:1rem}

  /* لعبة الذاكرة */
  .stats{display:flex;gap:18px;font-weight:500;margin-bottom:12px}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px}
  .card{aspect-ratio:1;border:0;border-radius:14px;background:var(--card);color:transparent;
        font-size:2.2rem;cursor:pointer;transition:transform .25s,background .25s}
  .card:focus-visible{outline:3px solid var(--ink)}
  .card.open{background:var(--face);color:inherit;transform:rotateY(180deg)}
  .card.open span{display:inline-block;transform:rotateY(180deg)}
  .card.done{background:var(--hit)}
  .msg{min-height:1.6em;font-weight:800}
  @media (prefers-reduced-motion:reduce){.card,.token{transition:none}#dice.rolling{animation:none}}
</style>
</head>
<body>

<!-- ============ الواجهة الأولى ============ -->
<section id="home" class="screen">
  <h1>الحية والدرج</h1>
  <p>سباق من المربع 1 إلى المربع 50. اصعد الدرج وتجنّب الحيّات!</p>
  <button class="btn pink" id="join">انضمام إلى اللعبة</button>
  <button class="btn light" id="toMemory">لعبة الذاكرة</button>

  <!-- مكان الإعلان: ضع هنا كود الإعلان من شبكة الإعلانات بدل النص -->
  <div class="ad" id="ad-home">مساحة إعلان</div>
</section>

<!-- ============ الحية والدرج ============ -->
<section id="snakes" class="screen hidden">
  <!-- وصف تحليلي لما يحدث في اللعبة -->
  <div class="analysis" id="analysis" aria-label="وصف تحليلي للعبة">
    <div class="arow me"><b>أنت:</b> <span id="aMe" aria-live="polite"></span></div>
    <div class="arow cpu"><b>الحاسوب:</b> <span id="aCpu" aria-live="polite"></span></div>
    <div class="apos" id="aPos"></div>
  </div>

  <div class="topbar">
    <button class="btn light small" id="backFromSnakes">القائمة</button>
    <div id="status"></div>
    <button class="btn small light" id="sound" aria-label="كتم الصوت">🔊</button>
    <button class="btn small pink" id="restartSnakes">من جديد</button>
  </div>

  <div class="boardwrap" id="boardwrap">
    <div class="sboard" id="sboard"></div>
    <svg id="lines" viewBox="0 0 100 50" preserveAspectRatio="none"></svg>
  </div>

  <div class="legend">
    <span><i style="background:#2e86ab"></i>أنت</span>
    <span><i style="background:#14323a"></i>الحاسوب</span>
  </div>

  <!-- مكان إعلان داخل اللعبة -->
  <div class="ad" id="ad-game">مساحة إعلان</div>

  <button id="dice" aria-label="ارمِ النرد"></button>
</section>

<!-- ============ لعبة الذاكرة ============ -->
<section id="memory" class="screen hidden">
  <h1>لعبة الذاكرة</h1>
  <div class="stats">
    <div>الحركات: <b id="moves">0</b></div>
    <div>أفضل نتيجة: <b id="best">-</b></div>
  </div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="again">لعبة جديدة</button>
  <button class="btn light" id="backFromMemory">القائمة</button>
  <div class="ad" id="ad-memory">مساحة إعلان</div>
</section>

<script>
/* ---------- التنقل بين الشاشات ---------- */
function show(id){
  ['home','snakes','memory'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
  window.scrollTo(0,0);
}
document.getElementById('join').onclick=()=>{audio();show('snakes');startSnakes();};
document.getElementById('toMemory').onclick=()=>{show('memory');startMemory();};
document.getElementById('backFromSnakes').onclick=()=>{gid++;busy=true;show('home');};
document.getElementById('backFromMemory').onclick=()=>show('home');

/* ---------- الحية والدرج (1 إلى 50) ---------- */
const SNAKES  = {17:4, 32:10, 40:23, 44:25, 48:29, 38:19, 49:30};
const LADDERS = {2:15, 8:27, 21:42, 28:46, 5:24, 33:47};
const sboard = document.getElementById('sboard');
const lines  = document.getElementById('lines');
const wrap   = document.getElementById('boardwrap');
const dice   = document.getElementById('dice');
const status = document.getElementById('status');
let pos=[0,0], turn=0, busy=false, tokens=[];

// مركز المربع بوحدات 0-100 أفقياً و 0-50 عمودياً
function center(n){
  const i=n-1, row=Math.floor(i/10), c=i%10, col=row%2===0?c:9-c;
  return {x:col*10+5, y:(4-row)*10+5};
}

function buildBoard(){
  sboard.innerHTML='';
  for(let r=4;r>=0;r--){
    for(let c=0;c<10;c++){
      const n=r*10+(r%2===0?c:9-c)+1;
      const d=document.createElement('div');
      d.className='cell'; d.textContent=n;
      sboard.appendChild(d);
    }
  }
  drawLines();
  wrap.querySelectorAll('.token').forEach(t=>t.remove());
  tokens=['me','cpu'].map(k=>{
    const t=document.createElement('div'); t.className='token '+k; wrap.appendChild(t); return t;
  });
  tokens.forEach((t,i)=>place(i));
}

function drawLines(){
  let s='';
  for(const [a,b] of Object.entries(LADDERS)){
    const p=center(+a), q=center(b);
    const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy*1.3, ny=ux*1.3;
    s+=`<g stroke="#5a3418" stroke-width="0.8" stroke-linecap="round">`;
    s+=`<line x1="${p.x+nx}" y1="${p.y+ny}" x2="${q.x+nx}" y2="${q.y+ny}"/>`;
    s+=`<line x1="${p.x-nx}" y1="${p.y-ny}" x2="${q.x-nx}" y2="${q.y-ny}"/>`;
    for(let t=2;t<len;t+=3){
      const x=p.x+ux*t, y=p.y+uy*t;
      s+=`<line x1="${x+nx}" y1="${y+ny}" x2="${x-nx}" y2="${y-ny}" stroke-width="0.6"/>`;
    }
    s+=`</g>`;
  }
  for(const [a,b] of Object.entries(SNAKES)){
    const p=center(+a), q=center(b);
    const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy), nx=-dy/len*6, ny=dx/len*6;
    const c1=`${p.x+dx*.25+nx} ${p.y+dy*.25+ny}`, c2=`${p.x+dx*.75-nx} ${p.y+dy*.75-ny}`;
    s+=`<path d="M${p.x} ${p.y} C${c1}, ${c2}, ${q.x} ${q.y}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
    s+=`<path d="M${p.x} ${p.y} C${c1}, ${c2}, ${q.x} ${q.y}" fill="none" stroke="#1f7a4d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 1.2"/>`;
    s+=`<circle cx="${p.x}" cy="${p.y}" r="1.7" fill="#1f7a4d" stroke="#fff" stroke-width=".5"/>`;
    s+=`<circle cx="${p.x-.5}" cy="${p.y-.4}" r=".4" fill="#fff"/><circle cx="${p.x+.5}" cy="${p.y-.4}" r=".4" fill="#fff"/>`;
  }
  lines.innerHTML=s;
}

function place(i){
  const n=pos[i];
  const off=(pos[0]===pos[1] && n>0)?(i===0?-1.4:1.4):0;
  const p=n===0?{x:-3,y:45}:center(n);
  tokens[i].style.left=(p.x+off)+'%';
  tokens[i].style.top=(p.y*2)+'%';
}

/* النرد: نقاط وردية على وجه ذهبي */
const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
dice.innerHTML='<span></span>'.repeat(9);
function showFace(v){
  [...dice.children].forEach((s,i)=>s.classList.toggle('on',FACES[v].includes(i)));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- محرك الأصوات (Web Audio، بلا ملفات خارجية) ---------- */
let AC=null, master=null, noiseBuf=null, soundOn=true;
try{ soundOn=localStorage.getItem('snakes-sound')!=='off'; }catch(e){}
function audio(){
  if(!AC){
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      AC=new C();
      master=AC.createGain(); master.gain.value=.8;
      const comp=AC.createDynamicsCompressor();
      master.connect(comp); comp.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended') AC.resume();
  return AC;
}
// نغمة بغلاف صوتي ناعم
function tone(f,delay,dur,o={}){
  const c=audio(); if(!c||!soundOn) return;
  const t=c.currentTime+delay;
  const {type='sine',vol=.2,slide=0,att=.006,cut=0,detune=0}=o;
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=type; osc.detune.value=detune;
  osc.frequency.setValueAtTime(f,t);
  if(slide) osc.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+att);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(cut){ const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut; osc.connect(lp); lp.connect(g); }
  else osc.connect(g);
  g.connect(master); osc.start(t); osc.stop(t+dur+.03);
}
// ضجيج مفلتر (لصوت النرد والفحيح)
function noise(delay,dur,vol,freq,q,type='bandpass'){
  const c=audio(); if(!c||!soundOn) return;
  const t=c.currentTime+delay;
  const src=c.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t,Math.random()*.5); src.stop(t+dur+.03);
}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
const sfx={
  // طقطقة النرد أثناء التدحرج
  tick(){ noise(0,.05,.28,1800+Math.random()*2200,3);
          tone(280+Math.random()*220,0,.05,{type:'triangle',vol:.12,cut:1500}); },
  // سقوط النرد واستقراره
  land(){ tone(170,0,.16,{type:'sine',vol:.35,slide:80}); noise(0,.07,.22,900,1.2);
          tone(1175,.03,.18,{type:'sine',vol:.08}); },
  // خطوة على المربعات: نغمة ناعمة تصاعدية
  step(k,who){ const f=PENTA[k%PENTA.length]*(who===0?1:.5);
          tone(f,0,.22,{type:'triangle',vol:.2,cut:3000});
          tone(f*2,0,.12,{type:'sine',vol:.05}); },
  // الدرج: أربيجيو صاعد لامع
  ladder(){ [523.25,659.25,783.99,1046.5,1318.5,1568].forEach((f,i)=>{
              tone(f,i*.075,.3,{type:'triangle',vol:.17,cut:4500});
              tone(f*2,i*.075,.18,{type:'sine',vol:.05}); }); },
  // الحية: انزلاق هابط مع فحيح
  snake(){ noise(0,.7,.2,5200,.8,'highpass');
           tone(520,0,.75,{type:'sawtooth',vol:.12,slide:80,cut:900});
           tone(530,0,.75,{type:'sawtooth',vol:.08,slide:85,cut:700,detune:18});
           tone(110,.5,.3,{type:'sine',vol:.2,slide:60}); },
  // الفوز
  win(){ [523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5].forEach((f,i)=>
           tone(f,i*.12,.4,{type:'triangle',vol:.2,cut:5000}));
         tone(1568,.9,.7,{type:'sine',vol:.12}); },
  // الخسارة
  lose(){ [440,392,349.23,293.66].forEach((f,i)=>tone(f,i*.18,.4,{type:'sine',vol:.2,cut:1800})); }
};
const soundBtn=document.getElementById('sound');
function syncSoundBtn(){
  soundBtn.textContent=soundOn?'🔊':'🔇';
  soundBtn.setAttribute('aria-label',soundOn?'كتم الصوت':'تشغيل الصوت');
}
soundBtn.onclick=()=>{
  soundOn=!soundOn; syncSoundBtn();
  try{localStorage.setItem('snakes-sound',soundOn?'on':'off');}catch(e){}
  if(soundOn){ audio(); tone(880,0,.15,{type:'triangle',vol:.15}); }
};
syncSoundBtn();

/* ---------- الوصف التحليلي ---------- */
let gid=0, round=0;
const aMe=document.getElementById('aMe'), aCpu=document.getElementById('aCpu'), aPos=document.getElementById('aPos');
const sq=n=>n===0?'البداية (خارج اللوحة)':'المربع '+n;
function setA(i,t){ (i===0?aMe:aCpu).textContent=t; }
function cnt(n,acc){ return n===1?'مربع واحد':n===2?(acc?'مربعين':'مربعان'):n<=10?n+' مربعات':n+' مربعًا'; }
function updPos(){
  const d=pos[0]-pos[1];
  const cmp = (pos[0]===0&&pos[1]===0) ? 'لم تبدأ المنافسة بعد'
            : d>0 ? 'أنت متقدّم بفارق '+cnt(d,true)
            : d<0 ? 'الحاسوب متقدّم بفارق '+cnt(-d,true)
            : 'أنتما في المربع نفسه';
  aPos.textContent='الجولة '+round+' • موضعك: '+(pos[0]||'البداية')+' • موضع الحاسوب: '+(pos[1]||'البداية')+
    ' • '+cmp+' • المتبقي لك '+cnt(50-pos[0])+' وللحاسوب '+cnt(50-pos[1]);
}

async function rollDice(my){
  dice.classList.add('rolling');
  for(let i=0;i<8;i++){
    showFace(1+Math.floor(Math.random()*6)); sfx.tick(); await sleep(70);
    if(my!==gid) break;
  }
  dice.classList.remove('rolling');
  const v=1+Math.floor(Math.random()*6);
  showFace(v);
  if(my===gid) sfx.land();
  return v;
}

async function play(i){
  const my=gid, me=(i===0), from=pos[i];
  const v=await rollDice(my);
  if(my!==gid) return;
  const rolled = me ? 'رميتَ النرد فظهر الرقم '+v : 'رمى الحاسوب النرد فظهر الرقم '+v;
  setA(i, rolled+'…');
  await sleep(350); if(my!==gid) return;

  for(let k=0;k<v && pos[i]<50;k++){
    pos[i]++; place(i); sfx.step(k,i); await sleep(280);
    if(my!==gid) return;
  }
  const landed=pos[i];
  let txt = rolled+'، '+(me?'فانتقلتَ':'فانتقل')+' من '+sq(from)+' إلى '+sq(landed)+'.';
  setA(i,txt); updPos();

  if(SNAKES[landed]){
    const to=SNAKES[landed];
    status.textContent=(me?'لدغتك حيّة!':'لدغت حيّةٌ الحاسوب');
    sfx.snake();
    txt+=' وكان المربع '+landed+' رأسَ حيّة، '+(me?'فلدغتك ونزلتَ':'فلدغته ونزل')+' إلى المربع '+to+'.';
    setA(i,txt);
    await sleep(450); if(my!==gid) return;
    pos[i]=to; place(i); updPos();
    await sleep(450); if(my!==gid) return;
  } else if(LADDERS[landed]){
    const to=LADDERS[landed];
    status.textContent=(me?'صعدت الدرج!':'صعد الحاسوب الدرج');
    sfx.ladder();
    txt+=' وكان المربع '+landed+' بدايةَ درج، '+(me?'فصعدتَ':'فصعد')+' إلى المربع '+to+'.';
    setA(i,txt);
    await sleep(450); if(my!==gid) return;
    pos[i]=to; place(i); updPos();
    await sleep(450); if(my!==gid) return;
  }

  if(pos[i]>=50){
    status.textContent=me?'فزت! أحسنت 🎉':'فاز الحاسوب، حاول مرة أخرى';
    setA(i, txt+(me?' ووصلتَ إلى المربع 50 وفزتَ باللعبة!':' ووصل الحاسوب إلى المربع 50 وفاز باللعبة.'));
    updPos();
    dice.disabled=true;
    if(me) sfx.win(); else sfx.lose();
    return;
  }
  next(me?1:0);
}

function next(t){
  turn=t;
  if(t===0){ status.textContent='دورك: اضغط على النرد'; dice.disabled=false; }
  else {
    status.textContent='دور الحاسوب...'; dice.disabled=true;
    const my=gid;
    setTimeout(()=>{ if(my===gid) play(1); },700);
  }
}

dice.onclick=()=>{
  if(turn!==0||dice.disabled) return;
  audio(); dice.disabled=true; round++; updPos(); play(0);
};
document.getElementById('restartSnakes').onclick=()=>{ audio(); startSnakes(); };

function startSnakes(){
  gid++; pos=[0,0]; turn=0; round=0;
  buildBoard(); showFace(1);
  aMe.textContent='لم ترمِ النرد بعد.'; aCpu.textContent='بانتظار دورك.';
  updPos();
  next(0);
}

/* ---------- لعبة الذاكرة ---------- */
const icons=['🍎','🚗','⚽','🌙','🐱','🎈'];
let first=null, lock=false, moves=0, matched=0;
const mboard=document.getElementById('board');
const movesEl=document.getElementById('moves');
const bestEl=document.getElementById('best');
const msg=document.getElementById('msg');
function getBest(){ try{return localStorage.getItem('memory-best');}catch(e){return null;} }
function setBest(v){ try{localStorage.setItem('memory-best',v);}catch(e){} }
function showBest(){ bestEl.textContent=getBest()||'-'; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startMemory(){
  mboard.innerHTML=''; first=null; lock=false; moves=0; matched=0;
  movesEl.textContent=0; msg.textContent=''; showBest();
  shuffle([...icons,...icons]).forEach(icon=>{
    const b=document.createElement('button');
    b.className='card'; b.dataset.icon=icon;
    b.setAttribute('aria-label','بطاقة مخفية');
    b.innerHTML='<span>'+icon+'</span>';
    b.addEventListener('click',()=>flip(b));
    mboard.appendChild(b);
  });
}
function flip(c){
  if(lock||c.classList.contains('open')||c.classList.contains('done')) return;
  c.classList.add('open');
  if(!first){ first=c; return; }
  moves++; movesEl.textContent=moves;
  if(first.dataset.icon===c.dataset.icon){
    first.classList.add('done'); c.classList.add('done'); first=null; matched++;
    if(matched===icons.length){
      msg.textContent='أحسنت! أنهيتها في '+moves+' حركة';
      const b=getBest(); if(!b||moves<Number(b)){ setBest(moves); showBest(); }
    }
  } else {
    lock=true;
    setTimeout(()=>{ first.classList.remove('open'); c.classList.remove('open'); first=null; lock=false; },800);
  }
}
document.getElementById('again').onclick=startMemory;
</script>
</body>
</html>
